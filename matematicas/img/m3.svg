<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#fbf7f0"/><text x="600" y="85" font-size="40" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">La división y su prueba</text><rect x="120" y="140" width="470" height="380" rx="18" fill="#fffdf8" stroke="#d8cbb8"/><text x="330" y="270" font-size="72" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">4.725</text><line x1="160" y1="300" x2="400" y2="300" stroke="#1e2a32" stroke-width="4"/><text x="330" y="400" font-size="72" fill="#147d6f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">945</text><text x="520" y="270" font-size="72" fill="#e07a5f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">5</text><text x="500" y="440" font-size="24" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">divisor</text><text x="700" y="250" font-size="26" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" >cociente</text><line x1="650" y1="265" x2="760" y2="265" stroke="#5b6b75" stroke-width="2"/><text x="600" y="610" font-size="54" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">D = d × c + r</text><text x="600" y="690" font-size="30" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">4.725 = 5 × 945 + 0  ·  resto 0 → división exacta</text></svg>