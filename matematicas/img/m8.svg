<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#fbf7f0"/><text x="600" y="85" font-size="38" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">Multiplicar y dividir decimales</text><rect x="80" y="150" width="500" height="360" rx="18" fill="#fffdf8" stroke="#d8cbb8"/><text x="330" y="230" font-size="52" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">2,5 × 4 = 10</text><text x="330" y="320" font-size="34" fill="#147d6f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">× 10</text><path d="M 200 370 Q 330 430 460 370" fill="none" stroke="#147d6f" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#147d6f"/></marker></defs><text x="330" y="470" font-size="26" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">coma un lugar a la derecha</text><rect x="620" y="150" width="500" height="360" rx="18" fill="#fffdf8" stroke="#d8cbb8"/><text x="870" y="230" font-size="48" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">45,6 ÷ 10 = 4,56</text><text x="870" y="320" font-size="34" fill="#e07a5f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">÷ 10</text><path d="M 1000 380 Q 870 440 740 380" fill="none" stroke="#e07a5f" stroke-width="4" marker-end="url(#b)"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e07a5f"/></marker></defs><text x="870" y="480" font-size="26" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">coma un lugar a la izquierda</text><text x="600" y="640" font-size="28" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">Multiplicar por 10, 100, 1.000 → la coma se mueve a la derecha</text></svg>