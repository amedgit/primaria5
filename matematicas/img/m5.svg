<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#fbf7f0"/><text x="600" y="85" font-size="38" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">Sumar fracciones con igual denominador</text><rect x="150" y="230" width="100" height="120" fill="#147d6f" stroke="#d8cbb8" stroke-width="2"/><rect x="250" y="230" width="100" height="120" fill="#147d6f" stroke="#d8cbb8" stroke-width="2"/><rect x="350" y="230" width="100" height="120" fill="#147d6f" stroke="#d8cbb8" stroke-width="2"/><rect x="450" y="230" width="100" height="120" fill="#e07a5f" stroke="#d8cbb8" stroke-width="2"/><rect x="550" y="230" width="100" height="120" fill="#e07a5f" stroke="#d8cbb8" stroke-width="2"/><rect x="650" y="230" width="100" height="120" fill="#fffdf8" stroke="#d8cbb8" stroke-width="2"/><rect x="750" y="230" width="100" height="120" fill="#fffdf8" stroke="#d8cbb8" stroke-width="2"/><rect x="850" y="230" width="100" height="120" fill="#fffdf8" stroke="#d8cbb8" stroke-width="2"/><text x="300" y="420" font-size="36" fill="#147d6f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">3/8</text><text x="500" y="420" font-size="36" fill="#e07a5f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">2/8</text><text x="600" y="560" font-size="62" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">3/8 + 2/8 = 5/8</text><text x="600" y="660" font-size="28" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">Se suman los numeradores y se mantiene el denominador</text></svg>