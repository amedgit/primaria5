<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect width="1200" height="800" fill="#fbf7f0"/><text x="600" y="80" font-size="40" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">Perímetro y área</text><rect x="110" y="200" width="480" height="240" fill="#d9ece7" stroke="#147d6f" stroke-width="4"/><text x="350" y="480" font-size="30" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">base = 6 m</text><text x="60" y="330" font-size="30" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" >3 m</text><text x="350" y="330" font-size="32" fill="#147d6f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">rectángulo</text><polygon points="700,440 980,440 840,260" fill="#f7ddd4" stroke="#e07a5f" stroke-width="4"/><text x="840" y="500" font-size="30" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">base = 8 m</text><text x="1000" y="360" font-size="30" fill="#5b6b75" font-family="DejaVu Sans, Verdana, sans-serif" >h = 5 m</text><text x="250" y="620" font-size="30" fill="#1e2a32" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">P = 2 × (6 + 3) = 18 m</text><text x="250" y="680" font-size="30" fill="#147d6f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">A = 6 × 3 = 18 m²</text><text x="840" y="620" font-size="30" fill="#e07a5f" font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle" font-weight="bold">A = 8 × 5 ÷ 2 = 20 m²</text></svg>